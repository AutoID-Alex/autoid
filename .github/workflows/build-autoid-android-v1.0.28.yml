name: Build AutoID Android v1.0.28

on:
  push:
    branches:
      - mobile-v1.0.28-fcm-privacy-consent
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare generated release sources
        run: |
          bash ci/prepare_v1016_release.sh
          python3 ci/apply_v1017_account_checkout.py
          python3 ci/apply_v1018_shopify_checkout.py
          python3 ci/apply_v1019_account_orders_performance.py
          python3 ci/fix_v1019_kotlin_structure.py
          python3 ci/apply_v1020_order_detail_rotation.py
          python3 ci/apply_v1021_unified_order_status.py
          python3 ci/patch_mobile_v118_account.py
          python3 ci/patch_mobile_v119_delivery_tracking.py
          python3 ci/patch_mobile_v1110_gls_awb.py
          python3 ci/apply_v1022_stripe_sandbox.py
          python3 ci/apply_v1023_product_reviews_compat.py
          python3 ci/fix_v1023_kotlin_calls.py
          python3 ci/apply_v1024_stripe_inline_googlepay.py
          python3 ci/apply_v1025_stripe_stability_cart_ui.py
          python3 ci/apply_v1026_home_tabs_notifications.py
          python3 ci/fix_v1026_kotlin.py
          python3 ci/apply_v1027_order_actions_awb_review.py
          python3 ci/fix_v1027_php_newlines.py
          python3 ci/apply_v1028_fcm_privacy.py
      - name: PHP lint v1.1.17
        run: php -l wordpress/autoid-mobile-commerce/autoid-mobile-commerce.php
      - name: Verify v1.0.28 FCM privacy invariants
        run: |
          set -eu
          API=android-v0.1/app/src/main/java/ro/autoid/app/data/AutoIdApi.kt
          MODELS=android-v0.1/app/src/main/java/ro/autoid/app/data/Models.kt
          MAIN=android-v0.1/app/src/main/java/ro/autoid/app/MainActivity.kt
          PUSH=android-v0.1/app/src/main/java/ro/autoid/app/PrivacyPushV128.kt
          UX=android-v0.1/app/src/main/java/ro/autoid/app/V114CommerceUx.kt
          MANIFEST=android-v0.1/app/src/main/AndroidManifest.xml
          GRADLE=android-v0.1/app/build.gradle.kts
          PLUGIN=wordpress/autoid-mobile-commerce/autoid-mobile-commerce.php
          grep -q 'AutoID-Android/1.0.28' "$API"
          grep -q 'versionCode = 13100' "$GRADLE"
          grep -q 'versionName = "1.0.28"' "$GRADLE"
          grep -q 'firebase-bom:34.18.0' "$GRADLE"
          grep -q 'firebase-messaging' "$GRADLE"
          grep -q 'PushConfigV128' "$MODELS"
          grep -q 'PrivacyPrefsV128' "$MODELS"
          grep -q 'pushConfigV128' "$API"
          grep -q 'registerPushV128' "$API"
          grep -q 'AutoIdApplicationV128' "$PUSH"
          grep -q 'AutoIdMessagingServiceV128' "$PUSH"
          grep -q 'MESSAGING_EVENT' "$MANIFEST"
          grep -q 'FirebaseBootstrapV128.refreshAndRegister' "$MAIN"
          grep -q 'Confidențialitate și consimțământ' "$UX"
          grep -q 'Actualizări despre comenzi' "$UX"
          grep -q 'Analytics' "$UX"
          grep -q 'Marketing & promoții' "$UX"
          grep -q 'ic_autoid_notification_v127' "$PUSH"
          grep -q 'Version: 1.1.17' "$PLUGIN"
          grep -q "'/push/config'" "$PLUGIN"
          grep -q "'/push/register'" "$PLUGIN"
          grep -q "'/push/unregister'" "$PLUGIN"
          grep -q "'/me/privacy'" "$PLUGIN"
          grep -q 'woocommerce_order_status_changed' "$PLUGIN"
          grep -q 'woocommerce_after_order_object_save' "$PLUGIN"
          grep -q 'fcm.googleapis.com/v1/projects/' "$PLUGIN"
          grep -q 'firebase.messaging' "$PLUGIN"
          grep -q 'GLS_AWB' "$PLUGIN"
          if grep -R -E 'sk_(test|live)_[A-Za-z0-9]+' android-v0.1/app/src/main/java; then exit 1; fi
          if grep -R -E 'BEGIN PRIVATE KEY|private_key_id' android-v0.1/app/src/main; then exit 1; fi
          keytool -list -v -keystore android-v0.1/autoid-dev.keystore -alias autoiddev -storepass autoiddev2026 | grep -q 'B1:C1:2A:66:11:22:0B:18:E0:42:E0:5D:77:57:9D:82:64:3F:CB:DB'
      - name: Package AutoID Mobile v1.1.17
        run: |
          rm -rf wordpress/autoid-mobile
          mv wordpress/autoid-mobile-commerce wordpress/autoid-mobile
          mv wordpress/autoid-mobile/autoid-mobile-commerce.php wordpress/autoid-mobile/autoid-mobile.php
          cd wordpress && zip -qr ../AutoID-Mobile-v1.1.17-WORDPRESS.zip autoid-mobile && cd ..
      - name: Bundle AutoID branding
        timeout-minutes: 4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p android-v0.1/app/src/main/res/drawable-nodpi
          curl -fL --connect-timeout 10 --max-time 45 --retry 2 --retry-delay 2 "https://www.autoid.ro/wp-content/uploads/Logo-AutoID.jpg" -o /tmp/autoid-logo.jpg
          curl -fL --connect-timeout 10 --max-time 45 --retry 2 --retry-delay 2 "https://www.autoid.ro/wp-content/uploads/2026/04/AUTOID-icon-1-png.webp" -o android-v0.1/app/src/main/res/drawable-nodpi/autoid_icon_v100.webp
          convert /tmp/autoid-logo.jpg -alpha on -fuzz 8% -transparent white -trim +repage android-v0.1/app/src/main/res/drawable-nodpi/autoid_logo_transparent.png
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build debug APK
        working-directory: android-v0.1
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../android-v1028-build.log
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoID-v1.0.28-build-log
          path: android-v1028-build.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Verify APK signing certificate
        run: keytool -printcert -jarfile android-v0.1/app/build/outputs/apk/debug/app-debug.apk | grep -q 'B1:C1:2A:66:11:22:0B:18:E0:42:E0:5D:77:57:9D:82:64:3F:CB:DB'
      - name: Prepare release files
        run: |
          cp android-v0.1/app/build/outputs/apk/debug/app-debug.apk AutoID-Professional-Solutions-v1.0.28-debug.apk
          sha256sum AutoID-Professional-Solutions-v1.0.28-debug.apk > AutoID-Professional-Solutions-v1.0.28-debug.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoID-Professional-Solutions-v1.0.28-APK
          path: |
            AutoID-Professional-Solutions-v1.0.28-debug.apk
            AutoID-Professional-Solutions-v1.0.28-debug.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload WordPress plugin
        uses: actions/upload-artifact@v4
        with:
          name: AutoID-Mobile-v1.1.17-WORDPRESS
          path: AutoID-Mobile-v1.1.17-WORDPRESS.zip
          if-no-files-found: error
          retention-days: 7
