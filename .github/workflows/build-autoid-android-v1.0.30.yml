name: Build AutoID Android v1.0.30 RC7.1 Privacy Orders Fix

on:
  push:
    branches: [mobile-v1.0.30-rc1-rfq]
    paths:
      - '.github/workflows/build-autoid-android-v1.0.30.yml'
      - 'ci/apply_v1029_native_chat.py'
      - 'ci/v129/**'
      - 'ci/apply_v1030_rfq_account.py'
      - 'ci/apply_v1030_chatfix.py'
      - 'ci/v130/**'
      - 'ci/apply_v1031_support_v2_chat.py'
      - 'ci/v131/**'
      - 'ci/apply_v1032_official_app_chat.py'
      - 'ci/v132/**'
      - 'ci/apply_v1033_rfq_header_no_favorites.py'
      - 'ci/v133/**'
      - 'ci/apply_v1034_persistent_admin_chat.py'
      - 'ci/v134/**'
      - 'ci/apply_v1035_rc7_uix_perf.py'
      - 'ci/apply_v1035_rc7_runner.py'
      - 'ci/fix_v1035_restore_privacy_orders.py'
      - 'ci/v135/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk-and-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare generated release sources
        run: |
          bash ci/prepare_v1016_release.sh
          python3 ci/apply_v1017_account_checkout.py
          python3 ci/apply_v1018_shopify_checkout.py
          python3 ci/apply_v1019_account_orders_performance.py
          python3 ci/fix_v1019_kotlin_structure.py
          python3 ci/apply_v1020_order_detail_rotation.py
          python3 ci/apply_v1021_unified_order_status.py
          python3 ci/patch_mobile_v118_account.py
          python3 ci/patch_mobile_v119_delivery_tracking.py
          python3 ci/patch_mobile_v1110_gls_awb.py
          python3 ci/apply_v1022_stripe_sandbox.py
          python3 ci/apply_v1023_product_reviews_compat.py
          python3 ci/fix_v1023_kotlin_calls.py
          python3 ci/apply_v1024_stripe_inline_googlepay.py
          python3 ci/apply_v1025_stripe_stability_cart_ui.py
          python3 ci/apply_v1026_home_tabs_notifications.py
          python3 ci/fix_v1026_kotlin.py
          python3 ci/apply_v1027_order_actions_awb_review.py
          python3 ci/fix_v1027_php_newlines.py
          python3 ci/apply_v1028_fcm_privacy.py
          python3 ci/fix_v1028_compile.py
          python3 ci/apply_v1029_native_chat.py
          python3 ci/apply_v1030_rfq_account.py
          python3 ci/apply_v1030_chatfix.py
          python3 ci/apply_v1031_support_v2_chat.py
          python3 ci/apply_v1032_official_app_chat.py
          python3 ci/apply_v1033_rfq_header_no_favorites.py
          python3 ci/apply_v1034_persistent_admin_chat.py
          python3 ci/apply_v1035_rc7_runner.py
          python3 ci/fix_v1035_restore_privacy_orders.py

      - name: PHP lint and RC7.1 contract checks
        run: |
          set -eu
          PLUGIN=wordpress/autoid-mobile-commerce/autoid-mobile-commerce.php
          php -l "$PLUGIN"
          grep -q 'Version: 1.1.28' "$PLUGIN"
          grep -q 'private static function order_tracking_payload($order)' "$PLUGIN"
          if grep -q 'order_tracking_payload_v119' "$PLUGIN"; then exit 1; fi
          grep -q "'/rfqs'" "$PLUGIN"
          grep -q "'/me/rfqs'" "$PLUGIN"
          grep -q "'/ai/history'" "$PLUGIN"
          grep -q "'/ai/reset'" "$PLUGIN"
          grep -q '/autoid-support/v2/app/chat' "$PLUGIN"
          grep -q 'AUTOID_SUPPORT_APP_TOKEN' "$PLUGIN"

      - name: Verify Android RC7.1 privacy account and security
        run: |
          set -eu
          GRADLE=android-v0.1/app/build.gradle.kts
          API=android-v0.1/app/src/main/java/ro/autoid/app/data/AutoIdApi.kt
          RFQ=android-v0.1/app/src/main/java/ro/autoid/app/RfqV130.kt
          CHAT=android-v0.1/app/src/main/java/ro/autoid/app/V129NativeChat.kt
          ACCOUNT=android-v0.1/app/src/main/java/ro/autoid/app/V135AccountUx.kt
          V100=android-v0.1/app/src/main/java/ro/autoid/app/V100Screens.kt
          MANIFEST=android-v0.1/app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 13304' "$GRADLE"
          grep -q 'versionName = "1.0.30"' "$GRADLE"
          grep -q 'Actualizări despre comenzi' "$ACCOUNT"
          grep -q 'Analytics' "$ACCOUNT"
          grep -q 'Personalizare' "$ACCOUNT"
          grep -q 'Marketing & promoții' "$ACCOUNT"
          grep -q 'PrivacyConsentStoreV128' "$ACCOUNT"
          grep -q 'FirebaseBootstrapV128.applyConsent' "$ACCOUNT"
          grep -q 'api.savePrivacyV128' "$ACCOUNT"
          grep -q 'Caută după Order ID' "$ACCOUNT"
          grep -q 'Caută după RFQ / ID' "$RFQ"
          grep -q 'PersistentAiChatScreenV135' "$CHAT"
          grep -q 'RfqHeaderActionV133' "$V100"
          if grep -q 'background(A135Soft).statusBarsPadding' "$ACCOUNT"; then exit 1; fi
          if grep -R -E 'AUTOID_SUPPORT_APP_TOKEN|OPENAI_API_KEY|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' android-v0.1/app/src/main; then exit 1; fi
          keytool -list -v -keystore android-v0.1/autoid-dev.keystore -alias autoiddev -storepass autoiddev2026 | grep -q 'B1:C1:2A:66:11:22:0B:18:E0:42:E0:5D:77:57:9D:82:64:3F:CB:DB'

      - name: Package AutoID Mobile v1.1.28
        run: |
          set -eu
          rm -rf wordpress/autoid-mobile release-wordpress
          cp -R wordpress/autoid-mobile-commerce wordpress/autoid-mobile
          mv wordpress/autoid-mobile/autoid-mobile-commerce.php wordpress/autoid-mobile/autoid-mobile.php
          mkdir -p release-wordpress
          cp -R wordpress/autoid-mobile release-wordpress/autoid-mobile
          test -f release-wordpress/autoid-mobile/autoid-mobile.php
          grep -q 'Plugin Name: AutoID Mobile' release-wordpress/autoid-mobile/autoid-mobile.php
          grep -q 'Version: 1.1.28' release-wordpress/autoid-mobile/autoid-mobile.php
          php -l release-wordpress/autoid-mobile/autoid-mobile.php
          cd wordpress
          zip -qr ../AutoID-Mobile-v1.1.28-WORDPRESS.zip autoid-mobile

      - name: Verify direct-install WordPress artifact layout
        run: |
          set -eu
          cd release-wordpress
          zip -qr /tmp/AutoID-Mobile-v1.1.28-direct-install-test.zip autoid-mobile
          unzip -l /tmp/AutoID-Mobile-v1.1.28-direct-install-test.zip | grep -q 'autoid-mobile/autoid-mobile.php'
          unzip -p /tmp/AutoID-Mobile-v1.1.28-direct-install-test.zip autoid-mobile/autoid-mobile.php | grep -q 'Plugin Name: AutoID Mobile'

      - name: Bundle AutoID branding
        timeout-minutes: 4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p android-v0.1/app/src/main/res/drawable-nodpi
          curl -fL --connect-timeout 10 --max-time 45 --retry 2 --retry-delay 2 "https://www.autoid.ro/wp-content/uploads/Logo-AutoID.jpg" -o /tmp/autoid-logo.jpg
          curl -fL --connect-timeout 10 --max-time 45 --retry 2 --retry-delay 2 "https://www.autoid.ro/wp-content/uploads/2026/04/AUTOID-icon-1-png.webp" -o android-v0.1/app/src/main/res/drawable-nodpi/autoid_icon_v100.webp
          convert /tmp/autoid-logo.jpg -alpha on -fuzz 8% -transparent white -trim +repage android-v0.1/app/src/main/res/drawable-nodpi/autoid_logo_transparent.png

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}

      - name: Build debug APK
        working-directory: android-v0.1
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../android-v1030-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: AutoID-v1.0.30-RC7.1-build-log, path: android-v1030-build.log, if-no-files-found: ignore, retention-days: 3}

      - name: Verify APK signing and secret exclusion
        run: |
          set -eu
          APK=android-v0.1/app/build/outputs/apk/debug/app-debug.apk
          keytool -printcert -jarfile "$APK" | grep -q 'B1:C1:2A:66:11:22:0B:18:E0:42:E0:5D:77:57:9D:82:64:3F:CB:DB'
          mkdir -p /tmp/autoid-apk-scan
          unzip -qq "$APK" -d /tmp/autoid-apk-scan
          if grep -R -a -E 'AUTOID_SUPPORT_APP_TOKEN|OPENAI_API_KEY|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' /tmp/autoid-apk-scan; then exit 1; fi

      - name: Prepare release files
        run: |
          cp android-v0.1/app/build/outputs/apk/debug/app-debug.apk AutoID-Professional-Solutions-v1.0.30-RC7.1-debug.apk
          sha256sum AutoID-Professional-Solutions-v1.0.30-RC7.1-debug.apk > AutoID-Professional-Solutions-v1.0.30-RC7.1-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoID-Professional-Solutions-v1.0.30-RC7.1-Privacy-Orders-Fix-APK
          path: |
            AutoID-Professional-Solutions-v1.0.30-RC7.1-debug.apk
            AutoID-Professional-Solutions-v1.0.30-RC7.1-debug.sha256
          retention-days: 14

      - name: Upload WordPress plugin direct-install artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoID-Mobile-v1.1.28-WORDPRESS-DIRECT-INSTALL
          path: release-wordpress
          if-no-files-found: error
          retention-days: 14
