name: Build AutoID Android v1.0.0

on:
  push:
    branches:
      - mobile-v1.0.0-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.5 base migration
        run: |
          python3 ci/apply_v05.py
          python3 ci/fix_v05_experimental.py

      - name: Apply v0.6 migration
        run: |
          python3 ci/apply_v06.py
          python3 ci/fix_v06_navigation_parse.py

      - name: Apply v0.7 migration
        run: python3 ci/apply_v07.py

      - name: Apply v0.8 migration
        run: python3 ci/apply_v08.py

      - name: Apply v1.0.0 migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ci/apply_v100.py')
          s=p.read_text()
          a=s.index("# Replace the v0.8 bridge")
          b=s.index("# Product model:",a)
          p.write_text(s[:a]+s[b:])
          PY
          python3 ci/apply_v100.py
          python3 ci/patch_bridge_v100.py

      - name: Bundle transparent AutoID branding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p android-v0.1/app/src/main/res/drawable-nodpi
          curl -fL --retry 3 --retry-delay 2 "https://www.autoid.ro/wp-content/uploads/Logo-AutoID.jpg" -o /tmp/autoid-logo.jpg
          curl -fL --retry 3 --retry-delay 2 "https://www.autoid.ro/wp-content/uploads/2026/04/AUTOID-icon-1-png.webp" -o android-v0.1/app/src/main/res/drawable-nodpi/autoid_icon_v100.webp
          convert /tmp/autoid-logo.jpg -alpha on -fuzz 8% -transparent white -trim +repage android-v0.1/app/src/main/res/drawable-nodpi/autoid_logo_transparent.png
          test -s android-v0.1/app/src/main/res/drawable-nodpi/autoid_logo_transparent.png
          test -s android-v0.1/app/src/main/res/drawable-nodpi/autoid_icon_v100.webp

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: android-v0.1
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Validate PHP bridge
        run: php -l wordpress/autoid-mobile-commerce/autoid-mobile-commerce.php

      - name: Prepare release artifacts
        run: |
          cp android-v0.1/app/build/outputs/apk/debug/app-debug.apk AutoID-Professional-Solutions-v1.0.0-debug.apk
          sha256sum AutoID-Professional-Solutions-v1.0.0-debug.apk > AutoID-Professional-Solutions-v1.0.0-debug.sha256
          zip -qr AutoID-Android-v1.0.0-source.zip android-v0.1 RELEASE-v1.0.0.md ci/apply_v100.py ci/patch_bridge_v100.py ci/v100
          cd wordpress && zip -qr ../AutoID-Mobile-Commerce-Bridge-v1.0.0.zip autoid-mobile-commerce && cd ..

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoID-Professional-Solutions-v1.0.0
          path: |
            AutoID-Professional-Solutions-v1.0.0-debug.apk
            AutoID-Professional-Solutions-v1.0.0-debug.sha256
            AutoID-Android-v1.0.0-source.zip
            AutoID-Mobile-Commerce-Bridge-v1.0.0.zip
            RELEASE-v1.0.0.md
          if-no-files-found: error
          retention-days: 7
