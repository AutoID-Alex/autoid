name: Build AutoID Android v0.2

on:
  push:
    branches:
      - mobile-v0.2-major
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build debug APK
        working-directory: android-v0.1
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare APK
        run: |
          cp android-v0.1/app/build/outputs/apk/debug/app-debug.apk AutoID-Shop-Support-v0.2.0-debug.apk
          sha256sum AutoID-Shop-Support-v0.2.0-debug.apk > AutoID-Shop-Support-v0.2.0-debug.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoID-Shop-Support-v0.2.0-debug
          path: |
            AutoID-Shop-Support-v0.2.0-debug.apk
            AutoID-Shop-Support-v0.2.0-debug.sha256
          if-no-files-found: error
          retention-days: 7
