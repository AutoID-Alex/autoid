name: Build AutoID Android v0.4

on:
  push:
    branches:
      - mobile-v0.4-product-family-uix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build debug APK
        working-directory: android-v0.1
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Validate PHP bridge
        run: php -l wordpress/autoid-mobile-commerce/autoid-mobile-commerce.php
      - name: Prepare release artifacts
        run: |
          cp android-v0.1/app/build/outputs/apk/debug/app-debug.apk AutoID-Professional-Solutions-v0.4.0-debug.apk
          sha256sum AutoID-Professional-Solutions-v0.4.0-debug.apk > AutoID-Professional-Solutions-v0.4.0-debug.sha256
          zip -qr AutoID-Android-v0.4.0-source.zip android-v0.1 RELEASE-v0.4.0.md
          cd wordpress && zip -qr ../AutoID-Mobile-Commerce-Bridge-v0.4.0.zip autoid-mobile-commerce && cd ..
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoID-Professional-Solutions-v0.4.0
          path: |
            AutoID-Professional-Solutions-v0.4.0-debug.apk
            AutoID-Professional-Solutions-v0.4.0-debug.sha256
            AutoID-Android-v0.4.0-source.zip
            AutoID-Mobile-Commerce-Bridge-v0.4.0.zip
            RELEASE-v0.4.0.md
          if-no-files-found: error
          retention-days: 7
