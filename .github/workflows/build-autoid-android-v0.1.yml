name: Build AutoID Android v0.1

on:
  push:
    branches:
      - mobile-v0.1-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Extract AutoID Android project
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q ci/autoid-android-v0.1.0-source.zip -d android-build
          sed -i 's/compileSdk = 37/compileSdk = 36/' android-build/autoid-android-v0.1.0/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' android-build/autoid-android-v0.1.0/app/build.gradle.kts

      - name: Build debug APK
        working-directory: android-build/autoid-android-v0.1.0
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          cp android-build/autoid-android-v0.1.0/app/build/outputs/apk/debug/app-debug.apk AutoID-Professional-Solutions-v0.1.0-debug.apk
          sha256sum AutoID-Professional-Solutions-v0.1.0-debug.apk > AutoID-Professional-Solutions-v0.1.0-debug.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoID-Professional-Solutions-v0.1.0-debug
          path: |
            AutoID-Professional-Solutions-v0.1.0-debug.apk
            AutoID-Professional-Solutions-v0.1.0-debug.sha256
          if-no-files-found: error
          retention-days: 7
