name: Materialize v1.0.29 base

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-v1.0.29-rc1-native-chat
    paths:
      - '.github/workflows/materialize-v1029-base.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate current release sources
        run: |
          bash ci/prepare_v1016_release.sh
          python3 ci/apply_v1017_account_checkout.py
          python3 ci/apply_v1018_shopify_checkout.py
          python3 ci/apply_v1019_account_orders_performance.py
          python3 ci/fix_v1019_kotlin_structure.py
          python3 ci/apply_v1020_order_detail_rotation.py
          python3 ci/apply_v1021_unified_order_status.py
          python3 ci/patch_mobile_v118_account.py
          python3 ci/patch_mobile_v119_delivery_tracking.py
          python3 ci/patch_mobile_v1110_gls_awb.py
          python3 ci/apply_v1022_stripe_sandbox.py
          python3 ci/apply_v1023_product_reviews_compat.py
          python3 ci/fix_v1023_kotlin_calls.py
          python3 ci/apply_v1024_stripe_inline_googlepay.py
          python3 ci/apply_v1025_stripe_stability_cart_ui.py
          python3 ci/apply_v1026_home_tabs_notifications.py
          python3 ci/fix_v1026_kotlin.py
          python3 ci/apply_v1027_order_actions_awb_review.py
          python3 ci/fix_v1027_php_newlines.py
          python3 ci/apply_v1028_fcm_privacy.py
          python3 ci/fix_v1028_compile.py
      - name: Copy generated source snapshot
        run: |
          rm -rf inspection/v129
          mkdir -p inspection/v129/android inspection/v129/plugin
          cp -R android-v0.1/app/src/main/java/ro/autoid/app inspection/v129/android/app
          cp android-v0.1/app/src/main/AndroidManifest.xml inspection/v129/android/AndroidManifest.xml
          cp android-v0.1/app/build.gradle.kts inspection/v129/android/build.gradle.kts
          cp wordpress/autoid-mobile-commerce/autoid-mobile-commerce.php inspection/v129/plugin/autoid-mobile-commerce.php
      - name: Commit snapshot
        run: |
          git config user.name 'AutoID Build Bot'
          git config user.email '121750896+AutoID-Alex@users.noreply.github.com'
          git add inspection/v129
          git diff --cached --quiet && exit 0
          git commit -m 'Materialize generated v1.0.28 base for v1.0.29 chat'
          git push
